name: cl-homeassistant
version: "0.9.180"
image: ghcr.io/charliel1981/cl-homeassistant-{arch}
slug: cl_homeassistant
description: Charlie's web interface and MCP server for this Home Assistant
url: https://github.com/charliel1981/cl-homeassistant
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Seconds the Supervisor waits after asking the add-on to stop (10 by default): it first tells a screen
# that is up to wait out the restart, on that screen's next ten-second tick.
timeout: 20
homeassistant_api: true
# Reachable inside HA as local-cl-homeassistant:8099; nothing is opened on the host.
ports:
  8099/tcp: null
# Home Assistant's own way in (0.9.88): HA's signed-in admins reach the page through HA on 8100, which only the
# Supervisor can call, so a dashboard can show the 3D house in a tab with no house key.
ingress: true
ingress_port: 8100
panel_icon: mdi:home-city-outline
# Settings → Add-ons → cl-homeassistant → Configuration.
# gate_key is the house key: it signs in to the page and links Alexa or Claude. Without it, both are off.
# ha_public_url is no longer used (the page no longer signs in through Home Assistant); it stays optional.
# Each oauth_clients entry: client_id, optional client_secret (leave out for a public client),
# name, and redirect_uris (space-separated).
# alexa_skill_id is the classic Alexa skill's id (amzn1.ask.skill.…); without it, POST /alexa answers 404.
# alexa_lwa_client_id and alexa_lwa_client_secret are the skill's own Alexa Skill Messaging credentials
# (developer console → Build → Permissions), not the account-linking secret. Both set turns on pushing to the widget.
# widget_light_rooms pins the Lights widget's four room tiles: comma-separated area ids, e.g.
# "kitchen, lounge, bedroom, hall". Without it, the tiles are the four areas with the most lights.
# kai_key_sha256 is the SHA-256 (hex) of the Mac's Kai key, which only posts Kai's AI tasks (mac/README.md).
# ambient_minutes is how long My House is left untouched before it rests on its face (a big clock, the
# weather and a line on the house; a tap brings the controls back). 5 when unset; 0 turns the face off.
# echo_reopen_entity is the Echo Show's media player from Alexa Media Player, e.g. media_player.echo_show_11:
# when My House has gone from it by accident, the add-on opens it again there (alexa/README.md). Unset, it never does.
# echo_reopen_after_s is how long My House may be gone first: 60 when unset, 30 to 3600.
# door_watch_entity is the sensor that says someone is at the front door, a binary_sensor (on) or an event entity
# (fires), e.g. binary_sensor.front_door_person: My House on the Show then brings the door camera up in its camera
# modal by itself (alexa/README.md). Unset, it never does.
# door_watch_camera is the camera it shows: camera.front_door when unset. Several, separated by commas (at most 3), are
# shown together: the first live, the rest as stills renewed while it is up, e.g. camera.front_door, camera.doorbell_snapshot.
# door_watch_close_s is how long the camera stays up before it closes itself: 60 when unset, 10 to 600.
# road_vehicle_entity is the sensor HA's road_vehicle_passed automation sets as a vehicle drives past a street camera,
# e.g. sensor.last_vehicle_past: My House on the Show then plays its van or car scene that way, and never at random
# (alexa/README.md). Unset, both play at random as before.
# road_vehicle_flip names the Frigate cameras whose left_to_right is the 3D road's right to left, separated by commas,
# e.g. fairviews. Unset, every camera is taken as it is.
# login_notify is the notify service of Charlie's phone in the companion app, e.g. notify.mobile_app_charlies_iphone_air:
# the sign-in page then offers to push a 6-digit code there, which signs that browser in without unlocking. Unset, it is off.
# ring_client_id, ring_client_secret and ring_hmac_key are Charlie's private Ring AppStore app's credentials and HMAC
# signing key (Ring developer portal). All three set turns on /ring/token, /ring/link and /ring/webhook, the
# ring_partner_event event in HA and the ring_devices and ring_events MCP tools (README "Ring"). Unset, Ring is off.
options:
  public_url: https://home.plot.org.uk
  oauth_clients: []
schema:
  public_url: url
  ha_public_url: url?
  gate_key: password?
  alexa_skill_id: str?
  alexa_lwa_client_id: str?
  alexa_lwa_client_secret: password?
  widget_light_rooms: str?
  kai_key_sha256: str?
  ambient_minutes: int(0,1440)?
  echo_reopen_entity: match(^media_player\.[a-z0-9_]+$)?
  echo_reopen_after_s: int(30,3600)?
  door_watch_entity: match(^(binary_sensor|event)\.[a-z0-9_]+$)?
  door_watch_camera: match(^camera\.[a-z0-9_]+(\s*,\s*camera\.[a-z0-9_]+){0,2}$)?
  door_watch_close_s: int(10,600)?
  road_vehicle_entity: match(^sensor\.[a-z0-9_]+$)?
  road_vehicle_flip: match(^[a-z0-9_]+(\s*,\s*[a-z0-9_]+){0,9}$)?
  login_notify: match(^notify\.[a-z0-9_]+$)?
  ring_client_id: str?
  ring_client_secret: password?
  ring_hmac_key: password?
  oauth_clients:
    - client_id: str
      client_secret: password?
      name: str?
      redirect_uris: str
