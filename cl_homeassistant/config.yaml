name: cl-homeassistant
version: "0.9.3"
image: ghcr.io/charliel1981/cl-homeassistant-{arch}
slug: cl_homeassistant
description: Charlie's web interface and MCP server for this Home Assistant
url: https://github.com/charliel1981/cl-homeassistant
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
# Reachable inside HA as local-cl-homeassistant:8099; nothing is opened on the host.
ports:
  8099/tcp: null
# Settings → Add-ons → cl-homeassistant → Configuration.
# gate_key is the house key: it signs in to the page and links Alexa or Claude. Without it, both are off.
# ha_public_url is no longer used (the page no longer signs in through Home Assistant); it stays optional.
# Each oauth_clients entry: client_id, optional client_secret (leave out for a public client),
# name, and redirect_uris (space-separated).
# alexa_skill_id is the classic Alexa skill's id (amzn1.ask.skill.…); without it, POST /alexa answers 404.
# alexa_lwa_client_id and alexa_lwa_client_secret are the skill's own Alexa Skill Messaging credentials
# (developer console → Build → Permissions), not the account-linking secret. Both set turns on pushing to the widget.
# widget_light_rooms pins the Lights widget's four room tiles: comma-separated area ids, e.g.
# "kitchen, lounge, bedroom, hall". Without it, the tiles are the four areas with the most lights.
# kai_key_sha256 is the SHA-256 (hex) of the Mac's Kai key, which only posts Kai's AI tasks (mac/README.md).
options:
  public_url: https://home.plot.org.uk
  oauth_clients: []
schema:
  public_url: url
  ha_public_url: url?
  gate_key: password?
  alexa_skill_id: str?
  alexa_lwa_client_id: str?
  alexa_lwa_client_secret: password?
  widget_light_rooms: str?
  kai_key_sha256: str?
  oauth_clients:
    - client_id: str
      client_secret: password?
      name: str?
      redirect_uris: str
